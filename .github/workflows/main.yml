name: Auto_ZHS_Master

on:
  schedule:
    # 每天北京时间 16:30 自动执行
    - cron: '30 08 * * *'
  workflow_dispatch: # 让你能手动点击运行按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Script for ALL courses
        env:
          U: ${{ secrets.ZHS_USERNAME }}
          P: ${{ secrets.ZHS_PASSWORD }}
        run: |
          # 核心命令：不带任何课程限制，直接刷全量课程
          # 为了在 Actions 中正常工作，关闭控制台进度条，避免日志过长
          python main.py -u "$U" -p "$P" --progressbar_view=false
